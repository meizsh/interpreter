server.port=8080
server.servlet.context-path=/
spring.application.name=ai-interpreter-backend

# ========== 百度 API 配置 ==========
# ASR (语音识别)
baidu.asr.api-key=${BAIDU_ASR_API_KEY:your-asr-api-key}
baidu.asr.secret-key=${BAIDU_ASR_SECRET_KEY:your-asr-secret-key}
baidu.asr.app-id=${BAIDU_ASR_APP_ID:your-app-id}
baidu.asr.format=mp3
baidu.asr.rate=16000

# LLM (千帆大模型 V2)
baidu.llm.api-key=${BAIDU_LLM_API_KEY:your-llm-api-key}
baidu.llm.secret-key=${BAIDU_LLM_SECRET_KEY:your-llm-secret-key}
baidu.llm.model=ernie-3.5-8k-0701
baidu.llm.temperature=0.7
baidu.llm.top-p=0.9
baidu.llm.max-output-tokens=2000

# ========== 文件存储配置 ==========
upload.dir=./uploads
upload.max-size=104857600
upload.allowed-formats=mp3,wav,m4a

# ========== 前端 CORS 配置 ==========
frontend.base-url=http://localhost:5173

# ========== 日志配置 ==========
logging.level.root=INFO
logging.level.com.interpreter=DEBUG
logging.level.org.springframework.web=INFO